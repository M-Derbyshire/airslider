<!DOCTYPE html>
<html>
    <head>
        <link rel="shortcut icon" href="#">
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <style>
            body {
                background-color: black;
                margin: 0;
            }
            
            canvas {
                position: absolute;
                width: 100%;
                height: 100%;
            }
        </style>
    </head>
    <body>
        <canvas></canvas>
        
        <script>
            const canvas = document.getElementsByTagName("canvas")[0];
            
            function correctCanvasSizes()
            {
                // We need to change the styling for the canvas, based on the DPI,
                // to avoid it being stretched and blurry.
                // getComputedStyle() is used in case the canvas size is in percentages. Slice takes off the "px".
                // .width and .height are not the same as .style.width and .style.height, and if they
                // are less than the style values, the image can be blurry (we also need to take into
                // account the devicePixelRatio)
                
                const computedStyles = window.getComputedStyle(canvas);
                const devicePixelRatio = (window.devicePixelRatio || 1);
                
                canvas.width = Number(computedStyles.width.slice(0, -2)) * devicePixelRatio;
                canvas.height = Number(computedStyles.height.slice(0, -2)) * devicePixelRatio;
            };
            
            correctCanvasSizes();
            window.addEventListener("resize", correctCanvasSizes);
        </script>
        
        <!-- Run the game -->
        <script src="./game.bundle.js"></script>
    </body>
</html>

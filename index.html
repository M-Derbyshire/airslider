<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <style>
            body {
                background-color: black;
                margin: 0;
            }
            
            canvas {
                position: absolute;
            }
        </style>
    </head>
    <body>
        <canvas id="backCan"></canvas>
        <canvas id="gameCan"></canvas>
        <canvas id="lightCan"></canvas>
        <canvas id="infoCan"></canvas>
        <canvas id="menuCan"></canvas>
        
        <script src="kernel.js"></script>
        <script src="gameEn.js"></script>
        <script src="graphicEn.js"></script>
        <script src="soundEn.js"></script>
        <script src="menuEn.js"></script>
        
        <!-- settings -->
        <script src="settings/controls.js"></script> <!-- give this object methods to set up your control event listeners, then call the methods when setting up the level -->
        
        <!-- helpers -->
        <script src="helpers/unitHelpers.js"></script> <!-- provides xUnit, yUnit, xSpeed and ySpeed -->
        <script src="helpers/zCalc.js"></script> <!-- calculates positions and widths/heights based on z position -->
        <script src="helpers/timeHelpers.js"></script> <!-- Converts seconds and minutes into a number of frames -->
        
        <!-- include any models here -->
        <script src="assets/models/model/model.js"></script> <!-- base model -->
        <script src="assets/models/tarian/tarian.js"></script>
        <script src="assets/models/shocker/shocker.js"></script>
        <!-- monsters -->
        <script src="assets/models/monster/monster.js"></script>
        <script src="assets/models/monsters/neonPidgeon/neonPidgeon.js"></script>
        <script src="assets/models/monsters/babyDragon/babyDragon.js"></script>
        <!-- attacks -->
        <script src="assets/models/monsters/attacks/lavaBall/lavaBall.js"></script>
        
        <!-- include any levels here -->
        <script src="assets/levels/level/level.js"></script> <!-- base level -->
        <script src="assets/levels/theConstruct/theConstruct.js"></script>
        
        <!-- include any HUDs and HUD components here -->
        <script src="assets/HUDs/HUD/HUD.js"></script><!-- base HUD -->
        <script src="assets/HUDs/components/HUDComponent/HUDComponent.js"></script><!-- base HUD component -->
        <script src="assets/HUDs/mainHUD/mainHUD.js"></script>
        <script src="assets/HUDs/components/healthBar/healthBar.js"></script>
        <script src="assets/HUDs/components/damageFlash/damageFlash.js"></script>
        
        <!-- include any extra scripts here -->
        
        <!-- start up the kernel -->
        <script>
            var kernel = new Kernel();
            window.addEventListener("load", function() {
                kernel.load();
                kernel.loadLevel(new TheConstruct()); //take this line out when creating menu system
                kernel.run();
            }, true);
        </script>
    </body>
</html>
